<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>

    <div class="topBar">
        <h1>My Library</h1>
        <button class="btnBook">Add Book</button>

    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="closeBtn">X</span>
            <form class="addNew">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title">

                <label for="author">Author:</label>
                <input type="text" id="author" name="author">

                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" min="1">
                
                <div class="checkbox">
                    <label for="vehicle1">Read?</label>
                    <input type="checkbox" id="read" name="read" value="read">
                </div>

                <label for="info">Info:</label>
                <input type="text" id="info" name="info">

                <input id="submit" type="submit" value="Submit">
            </form>
        </div>
    </div>

    <div class="bookWrapper">


    </div>
    
    <script src="./script.js"></script>
</body>
</html>
